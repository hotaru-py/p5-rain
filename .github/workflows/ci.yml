# Tests on every push and pull request: unit tests, then the browser checks
# (headless Chrome, p5 1.x and 2.x, snapshot fixture; no NASA calls).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Browser tests
        run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
